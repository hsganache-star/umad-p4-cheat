.pgt{font-size:18px;font-weight:800;margin:6px 0 14px}

.gap{text-align:center;color:#9a9a9a;font-size:12px;font-weight:700;margin:7px 0}

function mainConflict(o,k){ if(!o)return false; if(WL.indexOf(o)>=0&&WL.indexOf(k)>=0)return true; return o===k; }

function badges(){
  function cell(i,html){var c=$('my'+i);c.innerHTML=html||'ㅡ';c.classList.toggle('on',!!html);}
  var slot={fast:[],slow:[]};
  var anySight=st[1].sight||st[2].sight;
  [1,2].forEach(function(t){
    var s=st[t]; if(!s.real)return;
    var real=(s.real==='t');
    if(s.main==='water'||s.main==='lightning'){
      var my=(s.timer==='under')?'fast':(s.timer==='over')?'slow':null;
      if(my){
        var spread=real?'lightning':'water'; // 찐=번개 산개, 짭=물 산개
        if(s.main===spread) slot[my].push('산개'+(s.timer==='under'?NUM:BIND));
        else slot[my].push('쉐어');
      }
    }
    if(s.main==='bomb'){
      var bs=anySight?'fast':'slow'; // 마안 있으면 1물번개때, 없으면 2물번개때
      slot[bs].push(real?'멈춰':'움직여!');
    }
  });
  cell(2, slot.fast.length?slot.fast.join(' + '):'쉐어');
  cell(5, slot.slow.length?slot.slow.join(' + '):'쉐어');
  cell(3, st[1].real?(st[1].real==='t'?'보지마':'봐야대!!'):null);
  cell(6, st[2].real?(st[2].real==='t'?'보지마':'봐야대!!'):null);
  cell(4, fw.fire?(fw.fire==='t'?'채리엇 밖으로':'도넛 안으로'):null);
  cell(7, fw.watr?(fw.watr==='t'?'도넛 안으로':'채리엇 밖으로'):null);
}

function render(){
  [1,2].forEach(function(t){
    var s=st[t],o=st[t===1?2:1];
    $(t+'-true').classList.toggle('on',s.real==='t');
    $(t+'-false').classList.toggle('on',s.real==='f');
    var circ=(t===1)?'①':'②';
    $('sum'+t).textContent = s.real ? (s.real==='t'?('산개=번개 · 마안'+circ+' 보지마'):('산개=물 · 마안'+circ+' 봐야대!!')) : '';
    MAINS.forEach(function(k){
      var b=$(t+'_'+k), locked=mainConflict(o.main,k);
      b.classList.toggle('on',s.main===k);
      b.classList.toggle('lock',locked&&s.main!==k);
    });
    var sb=$(t+'_sight');
    sb.classList.toggle('on',s.sight);
    sb.classList.toggle('lock',o.sight&&!s.sight);
    $('timer'+t).style.display=(s.main==='water'||s.main==='lightning')?'':'none';
    $(t+'-under').classList.toggle('on',s.timer==='under');
    $(t+'-over').classList.toggle('on',s.timer==='over');
  });
  ['fire','watr'].forEach(function(g){
    $(g+'-t').classList.toggle('on',fw[g]==='t');
    $(g+'-f').classList.toggle('on',fw[g]==='f');
  });
  $('tgt3').style.display=st[1].sight?'':'none';
  $('tgt6').style.display=st[2].sight?'':'none';
  badges();
}

[1,2].forEach(function(t){
  $(t+'-true').onclick=function(){st[t].real='t';render();};
  $(t+'-false').onclick=function(){st[t].real='f';render();};
  MAINS.forEach(function(k){
    $(t+'_'+k).onclick=function(){
      var o=st[t===1?2:1];
      if(mainConflict(o.main,k))return;
      st[t].main=(st[t].main===k)?null:k;
      st[t].timer=null;
      render();
    };
  });
  $(t+'_sight').onclick=function(){
    var o=st[t===1?2:1];
    if(o.sight&&!st[t].sight)return;
    st[t].sight=!st[t].sight;
    render();
  };
  $(t+'-under').onclick=function(){st[t].timer=(st[t].timer==='under')?null:'under';render();};
  $(t+'-over').onclick=function(){st[t].timer=(st[t].timer==='over')?null:'over';render();};
});
['fire','watr'].forEach(function(g){
  $(g+'-t').onclick=function(){fw[g]='t';render();};
  $(g+'-f').onclick=function(){fw[g]='f';render();};
});

// 기록 칸: 직선(스텝2 뒤) · 부채꼴(스텝5 뒤) · 마력 해방(직선/부채꼴 각각, 스텝7 뒤)
var rec={line:null,fan:null,relLine:null,relFan:null};
function recRender(){
  [['rec-line','line'],['rec-fan','fan'],['rel-line','relLine'],['rel-fan','relFan']].forEach(function(p){
    $(p[0]+'-t').classList.toggle('on',rec[p[1]]==='t');
    $(p[0]+'-f').classList.toggle('on',rec[p[1]]==='f');
  });
  var L=(rec.line&&rec.relLine)?(rec.line===rec.relLine?'t':'f'):null;   // 실제 직선
  var F=(rec.fan&&rec.relFan)?(rec.fan===rec.relFan?'t':'f'):null;       // 실제 부채꼴
  var out='';
  if(L&&F){
    out=(L==='t')?((F==='t')?'다 피해':'부채꼴만 들어가'):((F==='t')?'직선만 들어가':'다 들어가');
  }else if(L){ out=(L==='t')?'직선 피해':'직선 들어가'; }
  else if(F){ out=(F==='t')?'부채꼴 피해':'부채꼴 들어가'; }
  $('rel-out').textContent=out;
}
[['rec-line','line'],['rec-fan','fan'],['rel-line','relLine'],['rel-fan','relFan']].forEach(function(p){
  $(p[0]+'-t').onclick=function(){rec[p[1]]=(rec[p[1]]==='t')?null:'t';recRender();};
  $(p[0]+'-f').onclick=function(){rec[p[1]]=(rec[p[1]]==='f')?null:'f';recRender();};
});
recRender();
render();
})();
