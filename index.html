*{box-sizing:border-box}
body{font-family:'Malgun Gothic',sans-serif;text-align:center;margin:0;padding:14px 8px 40px;
 -webkit-user-select:none;user-select:none;background:#fafafa;color:#141414}
.pgt{font-size:18px;font-weight:800;margin:6px 0 14px}
.inzone{max-width:660px;margin:0 auto 18px;text-align:left;display:flex;flex-direction:column;gap:10px}
.gcard{border:2px solid #c9c9c9;border-radius:12px;background:#fff;padding:11px 14px}
.gtitle{font-weight:800;font-size:16px;margin-bottom:7px}
.grow{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:6px 0}
.tf{font-size:15px;font-weight:700;padding:7px 0;border:1px solid #555;border-radius:8px;background:#ececec;cursor:pointer;width:74px}
.tf.on{background:cornflowerblue;color:#fff;border-color:#2f5fb0}
.gsum{font-size:15px;font-weight:800;color:#a32d2d;margin-left:4px}
.resetbtn{position:fixed;top:6px;left:6px;z-index:99;font-size:12px;font-weight:700;padding:6px 10px;border:1px solid #a32d2d;border-radius:8px;background:#e24b4a;color:#fff;cursor:pointer}
.gobtn{display:block;width:100%;margin-top:9px;font-size:22px;font-weight:800;padding:14px 0;border:2px solid #1d6e56;border-radius:12px;background:#2e8b6f;color:#fff;cursor:pointer;animation:goPulse 1.1s ease-in-out infinite}
@keyframes goPulse{0%,100%{box-shadow:0 0 5px 1px rgba(46,139,111,.7);transform:scale(1)}50%{box-shadow:0 0 22px 7px rgba(71,217,168,.95);transform:scale(1.03)}}
.imgmodebtn{position:fixed;top:6px;right:86px;z-index:99;font-size:12px;font-weight:700;padding:6px 10px;border:1px solid #555;border-radius:8px;background:#fff;color:#333;cursor:pointer}
.imgmodebtn.on{background:#ffd400;border-color:#e24b4a}
body.imgmode .tf.jjin,body.imgmode .tf.jjap{width:52px;height:52px;font-size:0;color:transparent;background-size:cover;background-position:center;border:3px solid #bbb;border-radius:10px;padding:0}

body.imgmode .tf.jjin.on,body.imgmode .tf.jjap.on{border-color:#e24b4a;box-shadow:0 0 0 3px #ffd400}
body.combat.imgmode .tf.jjin,body.combat.imgmode .tf.jjap{width:40px;height:40px}
body:not(.combat) .tl{display:none}
body.imgmode .tfrow{justify-content:center}
body.combat .sightstep{display:flex;flex-direction:column}
body.combat .sightstep .stbody{order:-1;margin:0 0 6px}
body.combat .puzrow{margin:2px 0;gap:8px}
body.combat .puzrow .cpic{width:30px;height:30px}
body.combat .puzrow .rr{font-size:18px}
body.combat .stepcard.puzzle{padding:4px 8px}
body.combat .stepcard.puzzle .stbody{margin-top:2px}
.lab{font-size:13px;color:#777;min-width:44px}
.pick{display:inline-flex;align-items:center;gap:5px;font-size:14px;font-weight:700;padding:6px 10px;border:1px solid #888;border-radius:8px;background:#fff;cursor:pointer}
.pick img{width:24px;height:24px}
.pick.on{background:#ffd400;border:2px solid #e24b4a}
.pick.lock{background:#e2e2e2;color:#aaa;opacity:.55;cursor:not-allowed}
.pick.lock img{filter:grayscale(1)}
.chip{font-size:13px;font-weight:700;padding:5px 11px;border:1px solid #999;border-radius:9px;background:#fff;cursor:pointer;color:#555}
.chip.on{background:#e24b4a;color:#fff;border-color:#a32d2d}
.reccard{border:2px dashed #b08900;border-radius:10px;background:#fffbe8;padding:9px 12px;display:flex;align-items:center;gap:9px;justify-content:center;margin:7px 0}
.rname{font-weight:800;font-size:17px}
.recout{font-weight:800;color:#1d6e56;font-size:15px;margin-left:4px}
.tgt{margin-top:9px;text-align:center;font-size:20px;font-weight:800;color:#fff;background:#e24b4a;border-radius:8px;padding:8px}
.stepcard.alert{background:#e24b4a;border-color:#a32d2d;border-left-color:#7c1f1f}
.stepcard.alert .tgt{background:#fff;color:#e24b4a}
.stepcard.alert .stnum{background:#7c1f1f}
.tl{max-width:660px;margin:0 auto;text-align:left}
.stepcard{border:2px solid #d0d0d0;border-left:9px solid #6a8ec9;border-radius:12px;background:#fff;padding:12px 14px;margin-bottom:10px}
.stepcard.fire{border-left-color:#e24b4a}
.stepcard.water{border-left-color:#378add}
.stepcard.puzzle{border-left-color:#b08900}
.sthead{display:flex;align-items:center;gap:9px}
.stnum{flex:none;width:30px;height:30px;border-radius:50%;background:#333;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:16px}
.sttitle{font-weight:800;font-size:18px;flex:1;line-height:1.25}
.stepcard.fire .sttitle{color:#c0392b}
.stepcard.water .sttitle{color:#1d6fb8}
.sttitle .plus{font-weight:700;font-size:14px;color:#777}
.sticons{flex:none;display:flex;gap:4px}
.ticon{width:40px;height:40px;border:1px solid #ccc;border-radius:7px;background:#f2f2f2}
.stbody{margin-top:10px}
.gap{text-align:center;color:#9a9a9a;font-size:12px;font-weight:700;margin:7px 0}
.myact{flex:none;min-width:96px;text-align:center;font-size:19px;font-weight:800;padding:8px 11px;border-radius:9px;background:#f0f0f0;color:#c0c0c0;border:2px dashed #ccc}
.myact.on{background:#ffd400;color:#111;border:2px solid #e24b4a}
.bjing{width:22px;height:22px;vertical-align:-4px;margin-left:4px}
.cprule{display:flex;flex-direction:column;max-width:360px;margin:4px auto 0;border:2px solid #555;border-radius:10px;overflow:hidden}
.cprow{display:flex;align-items:center;gap:10px;padding:12px 16px;font-size:19px;border-bottom:2px solid #ddd}
.cprule .cprow:last-child{border-bottom:none}
.cprow.allag{background:#fff8e0;border-left:8px solid #e6b800}
.cprow.death{background:#f3eaff;border-left:8px solid #7a3fb0}
.cprow .cpic{width:46px;height:46px}
.cprow b{font-weight:800;font-size:22px}
.cprow .rr{margin-left:auto;font-weight:700}
.arw{width:30px;height:30px;vertical-align:middle}
.arw path{stroke:#c8920a;stroke-width:2.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.arw.down path{stroke:#7a3fb0}
.cpflip{font-size:15px;color:#a32d2d;font-weight:700;margin:9px 0 2px;text-align:center}
.relbig{font-size:21px;font-weight:800;color:#fff;background:#e24b4a;border-radius:8px;padding:7px 18px;margin-top:3px}
.imgbtn{border:3px solid #bbb;border-radius:10px;background:#fff;cursor:pointer;padding:2px;line-height:0}
.imgbtn img{width:46px;height:46px;border-radius:7px;display:block}
.imgbtn.on{border-color:#e24b4a;background:#ffd400;box-shadow:0 0 0 2px #e24b4a}
.relbig:empty{display:none}
.redo{flex:none;width:36px;height:36px;border:1px solid #888;border-radius:50%;background:#fff;cursor:pointer;padding:6px;line-height:0}
.redo svg{width:100%;height:100%}
.stepcard.finale{animation:finGlow 1s ease-in-out infinite;border-color:#00a8d8}
@keyframes finGlow{0%,100%{box-shadow:0 0 4px 1px rgba(0,190,255,.55)}50%{box-shadow:0 0 22px 8px rgba(0,215,255,.95)}}
.stepcard.finale .myact{font-size:30px;padding:13px 8px}
body.combat .stepcard.finale .myact{font-size:32px}
.credit{margin-top:16px;font-size:12px;color:#999;text-align:center}
/* ── v3 compact ── */
.inzone,.tl{max-width:390px}
body{padding:10px 6px 30px}
.pgt{font-size:15px;margin:4px 0 10px}
.gcard{padding:9px 10px}
.gtitle{font-size:14px;margin-bottom:5px}
.tf{width:58px;font-size:13px;padding:6px 0}
.gsum{font-size:13px}
.lab{font-size:12px;min-width:38px}
.pick{font-size:12px;padding:5px 7px;gap:4px}
.pick img{width:20px;height:20px}
.chip{font-size:12px;padding:4px 9px}
.stepcard{padding:9px 10px;border-left-width:7px}
.stnum{width:24px;height:24px;font-size:13px}
.sttitle{font-size:15px}
.sttitle .plus{font-size:12px}
.ticon{width:28px;height:28px}
.myact{min-width:68px;font-size:15px;padding:6px 8px}
.bjing{width:18px;height:18px;vertical-align:-3px}
.cprow{font-size:15px;padding:8px 10px;gap:7px}
.puzrow{display:flex;align-items:center;justify-content:center;gap:10px;margin:5px 0}
.puzrow .cpic{width:44px;height:44px}
.puzrow .rr{font-size:22px;font-weight:800}
.puzrow .ra{color:#b08900}
.puzrow .rd{color:#7a3fb0}
.arw{width:22px;height:22px}
.cpflip{font-size:13px}
.reccard{padding:7px 8px;gap:6px}
.rname{font-size:14px}
.tgt{font-size:16px;padding:6px}
.relbig{font-size:16px;padding:6px 12px}

body.combat .inzone,body.combat .pgt{display:none}

body.combat .tgt{font-size:14px;padding:5px;margin-top:5px}

function mainConflict(o,k){ if(!o)return false; if(WL.indexOf(o)>=0&&WL.indexOf(k)>=0)return true; return o===k; }

function badges(){
  function cell(i,html){var c=$('my'+i);c.innerHTML=html||'ㅡ';c.classList.toggle('on',!!html);}
  var slot={fast:[],slow:[]};
  var anySight=st[1].sight||st[2].sight;
  [1,2].forEach(function(t){
    var s=st[t]; if(!s.real)return;
    var real=(s.real==='t');
    if(s.main==='water'||s.main==='lightning'){
      var my=(s.timer==='under')?'fast':(s.timer==='over')?'slow':null;
      if(my){
        // 물/번개 = '준 그크'의 찐짭 기준 (3판 실전 검증)
        var spread=real?'lightning':'water';
        if(s.main===spread) slot[my].push('산개'+(s.timer==='under'?NUM:BIND));
        else slot[my].push('쉐어');
      }
    }
    if(s.main==='bomb'){
      // 배치: ②發 가속도=1물번개때(실전 확인), ①發=마안 동반이면 1물번개때·아니면 2물번개때
      var bs=(t===2)?'fast':(anySight?'fast':'slow');
      slot[bs].push(real?'멈춰':'움직여!'); // 판정은 '부여받은 순간의 찐짭'
    }
  });
  cell(2, slot.fast.length?slot.fast.join(' + '):'쉐어');
  cell(5, slot.slow.length?slot.slow.join(' + '):'쉐어');
  cell(3, st[1].real?(st[1].real==='t'?'보지마':'봐야대!!'):null);
  cell(6, st[2].real?(st[2].real==='t'?'보지마':'봐야대!!'):null);
  cell(4, fw.fire?(fw.fire==='t'?'채리엇 밖으로':'도넛 안으로'):null);
  cell(7, fw.watr?(fw.watr==='t'?'도넛 안으로':'채리엇 밖으로'):null);
  if(typeof rec==='object'&&rec)updateFinal();
}

function render(){
  [1,2].forEach(function(t){
    var s=st[t],o=st[t===1?2:1];
    $(t+'-true').classList.toggle('on',s.real==='t');
    $(t+'-false').classList.toggle('on',s.real==='f');
    var circ=(t===1)?'①':'②';
    $('sum'+t).textContent = s.real ? (s.real==='t'?('산개=번개 · 마안'+circ+' 보지마'):('산개=물 · 마안'+circ+' 봐야대!!')) : '';
    MAINS.forEach(function(k){
      var b=$(t+'_'+k), locked=mainConflict(o.main,k);
      b.classList.toggle('on',s.main===k);
      b.classList.toggle('lock',locked&&s.main!==k);
    });
    var sb=$(t+'_sight');
    sb.classList.toggle('on',s.sight);
    sb.classList.toggle('lock',o.sight&&!s.sight);
    $('timer'+t).style.display=(s.main==='water'||s.main==='lightning')?'':'none';
    $(t+'-under').classList.toggle('on',s.timer==='under');
    $(t+'-over').classList.toggle('on',s.timer==='over');
  });
  ['fire','watr'].forEach(function(g){
    $(g+'-t').classList.toggle('on',fw[g]==='t');
    $(g+'-f').classList.toggle('on',fw[g]==='f');
  });
  $('tgt3').style.display=st[1].sight?'':'none';
  $('tgt6').style.display=st[2].sight?'':'none';
  $('tgt3').closest('.stepcard').classList.toggle('alert',st[1].sight);
  $('tgt6').closest('.stepcard').classList.toggle('alert',st[2].sight);
  badges();
}

[1,2].forEach(function(t){
  $(t+'-true').onclick=function(){st[t].real='t';render();};
  $(t+'-false').onclick=function(){st[t].real='f';render();};
  MAINS.forEach(function(k){
    $(t+'_'+k).onclick=function(){
      var o=st[t===1?2:1];
      if(mainConflict(o.main,k))return;
      st[t].main=(st[t].main===k)?null:k;
      st[t].timer=null;
      render();
    };
  });
  $(t+'_sight').onclick=function(){
    var o=st[t===1?2:1];
    if(o.sight&&!st[t].sight)return;
    st[t].sight=!st[t].sight;
    render();
  };
  $(t+'-under').onclick=function(){st[t].timer=(st[t].timer==='under')?null:'under';render();};
  $(t+'-over').onclick=function(){st[t].timer=(st[t].timer==='over')?null:'over';render();};
});
['fire','watr'].forEach(function(g){
  $(g+'-t').onclick=function(){fw[g]='t';render();recRender();};
  $(g+'-f').onclick=function(){fw[g]='f';render();recRender();};
});

// 기록 칸: 직선(스텝2 뒤) · 부채꼴(스텝5 뒤) · 마력 해방(직선/부채꼴 각각, 스텝7 뒤)
var rec={line:null,fan:null,relLine:null,relFan:null};
function recRender(){
  [['rec-line','line'],['rec-fan','fan'],['rel-line','relLine'],['rel-fan','relFan']].forEach(function(p){
    $(p[0]+'-t').classList.toggle('on',rec[p[1]]==='t');
    $(p[0]+'-f').classList.toggle('on',rec[p[1]]==='f');
  });
  var L=(rec.line&&rec.relLine)?(rec.line===rec.relLine?'t':'f'):null;   // 실제 직선
  var F=(rec.fan&&rec.relFan)?(rec.fan===rec.relFan?'t':'f'):null;       // 실제 부채꼴
  var out='';
  if(L&&F){
    out=(L==='t')?((F==='t')?'다 피해':'부채꼴만 들어가'):((F==='t')?'직선만 들어가':'다 들어가');
  }else if(L){ out=(L==='t')?'직선 피해':'직선 들어가'; }
  else if(F){ out=(F==='t')?'부채꼴 피해':'부채꼴 들어가'; }
  $('rel-out').textContent=out;
  updateFinal();
}
function updateFinal(){
  var L=(rec.line&&rec.relLine)?(rec.line===rec.relLine?'t':'f'):null;
  var F=(rec.fan&&rec.relFan)?(rec.fan===rec.relFan?'t':'f'):null;
  var card=$('relcard'), my7=$('my7'), redo=$('redo-rel'), step7=my7.parentElement.parentElement;
  if(L&&F&&fw.watr){
    var rel=(L==='t')?((F==='t')?'전부 피해':'부채꼴만 들어가'):((F==='t')?'직선만 들어가':'다 밟아');
    var pre=(fw.watr==='t')?'안에서':'밖으로';
    card.style.display='none';
    my7.textContent=pre+' + '+rel;
    my7.classList.add('on');
    redo.style.display='';
    step7.classList.add('finale');
  }else{
    card.style.display='';
    redo.style.display='none';
    step7.classList.remove('finale');
  }
}
[['rec-line','line'],['rec-fan','fan'],['rel-line','relLine'],['rel-fan','relFan']].forEach(function(p){
  $(p[0]+'-t').onclick=function(){rec[p[1]]=(rec[p[1]]==='t')?null:'t';recRender();};
  $(p[0]+'-f').onclick=function(){rec[p[1]]=(rec[p[1]]==='f')?null:'f';recRender();};
});
recRender();
function validate(){
  var m=[];
  if(!st[1].real)m.push('그크① 찐/짭');
  if(!st[1].main&&!st[1].sight)m.push('그크① 내 디버프');
  if((st[1].main==='water'||st[1].main==='lightning')&&!st[1].timer)m.push('그크① 타이머');
  if(!st[2].real)m.push('그크② 찐/짭');
  if(!st[2].main&&!st[2].sight)m.push('그크② 내 디버프');
  if((st[2].main==='water'||st[2].main==='lightning')&&!st[2].timer)m.push('그크② 타이머');
  return m;
}
function flashBtn(b,msg){
  if(b._f)return; b._f=1;
  var old=b.textContent; b.textContent=msg;
  setTimeout(function(){b.textContent=old;b._f=0;},1400);
}
$('reset-btn').onclick=function(){location.reload();};
$('go-btn').onclick=function(){
  var m=validate();
  if(m.length){flashBtn(this,'⚠ '+m[0]+' 먼저!');return;}
  if(!document.body.classList.contains('combat')) $('combat-btn').click();
};
$('imgmode-btn').onclick=function(){
  var on=document.body.classList.toggle('imgmode');
  this.classList.toggle('on',on);
  try{localStorage.setItem('imgmode',on?'1':'0');}catch(e){}
};
$('redo-rel').onclick=function(){rec.relLine=null;rec.relFan=null;recRender();render();};
document.documentElement.style.scrollSnapType='y proximity';
$('my2').parentElement.parentElement.style.scrollSnapAlign='start';
document.querySelector('.stepcard.puzzle').style.scrollSnapAlign='start';
try{ if(localStorage.getItem('imgmode')==='1'){document.body.classList.add('imgmode');$('imgmode-btn').classList.add('on');} }catch(e){}
$('combat-btn').onclick=function(){
  if(!document.body.classList.contains('combat')){
    var m=validate();
    if(m.length){flashBtn(this,'⚠ 입력 부족');return;}
  }
  document.body.classList.toggle('combat');
  var on=document.body.classList.contains('combat');
  this.textContent=on?'입력 보기':'실전 모드';
  var tl=document.querySelector('.tl');
  if(on){
    var s2=$('my2').parentElement.parentElement;
    tl.style.paddingBottom='0px';
    var pad=Math.max(0, s2.offsetTop + window.innerHeight - document.body.scrollHeight + 8);
    tl.style.paddingBottom=pad+'px';
    window.scrollTo(0,s2.offsetTop-4);
  }else{
    tl.style.paddingBottom='';
    window.scrollTo(0,0);
  }
};
render();
})();
</script></body></html>
